<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{--blue:#3aa0ff;--deep:#1a5fb4;--ink:#0f2a4a;--card:#f4fbff;--line:#8cc8f5;--gold:#ffc800}
html,body{margin:0;min-height:100%;font-family:'Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(180deg,#d9f1ff,#9fd3ff 70%,#86c5fb);background-attachment:fixed}
h1,h2,h3,.btn,.ddbtn,.pname,.lbl,.px{font-family:'Press Start 2P',monospace}
h2{font-size:18px;margin:0}h3{font-size:12px;margin:0 0 12px}
.pix{image-rendering:pixelated}
input,select,textarea{font:inherit;padding:10px 12px;border:3px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.btn{font-size:10px;line-height:1.4;padding:12px 14px;border:3px solid var(--deep);background:var(--blue);color:#fff;border-radius:10px;box-shadow:0 5px 0 var(--deep);cursor:pointer;text-shadow:1px 1px 0 rgba(0,0,0,.25);transition:transform .05s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
.btn.alt{background:#fff;color:var(--deep);text-shadow:none}
.btn.red{background:#ff5a5f;border-color:#a62b30;box-shadow:0 5px 0 #a62b30}
.btn.green{background:#35c75a;border-color:#1c7d36;box-shadow:0 5px 0 #1c7d36}
.btn.gold{background:#ffc800;border-color:#a67c00;box-shadow:0 5px 0 #a67c00;color:#3a2a00;text-shadow:none}
.btn.sm{font-size:8px;padding:8px 10px;box-shadow:0 3px 0 var(--deep)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--card);border:3px solid var(--deep);border-radius:18px;box-shadow:0 6px 0 rgba(26,95,180,.35);padding:16px}
.uname.gold{color:#e0a800;font-weight:900;text-shadow:0 0 6px rgba(255,200,0,.8),1px 1px 0 #7a5a00;animation:shine 2s linear infinite}
@keyframes shine{50%{filter:brightness(1.35)}}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:min(440px,100%);text-align:center}
.authbox h1{font-size:26px;line-height:1.3;color:var(--deep);text-shadow:3px 3px 0 #fff;margin:0 0 6px}
.authbox .tag{font-size:12px;margin-bottom:18px;color:#2a6fb8}
.authbox form{display:flex;flex-direction:column;gap:10px;text-align:left}
.authbox label{font-size:12px;font-weight:700;color:var(--deep)}
.authbox .row{display:flex;gap:10px;align-items:center}
.authbox .err{color:#c62828;font-weight:700;min-height:18px;font-size:13px}
.authbox .stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.small{font-size:12px;color:#456}
#cap{border:3px solid var(--line);border-radius:10px;background:#fff;image-rendering:pixelated}
/* layout */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(244,251,255,.92);border-bottom:3px solid var(--deep);backdrop-filter:blur(6px)}
.topbar .grow{flex:1}
.dd{position:relative}
.ddbtn{min-width:230px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11px;padding:12px 14px;border:3px solid var(--deep);background:#fff;color:var(--deep);border-radius:12px;box-shadow:0 4px 0 var(--deep);cursor:pointer}
.ddbtn .caret{font-size:9px;transition:transform .15s}
.dd.open .caret{transform:rotate(180deg)}
.ddlist{position:absolute;top:calc(100% + 8px);left:0;min-width:100%;background:#fff;border:3px solid var(--deep);border-radius:12px;box-shadow:0 8px 0 rgba(26,95,180,.35);overflow:hidden;display:none;z-index:60}
.dd.open .ddlist{display:block}
.ddi{display:flex;align-items:center;gap:10px;padding:12px 14px;font-family:'Press Start 2P',monospace;font-size:10px;color:var(--deep);cursor:pointer}
.ddi i{width:12px;height:12px;border:2px solid var(--deep);border-radius:3px}
.ddi:hover,.ddi.on{background:#dff1ff}
.netbadge{font-size:10px;font-family:'Press Start 2P',monospace;padding:7px 9px;border-radius:8px;border:2px solid var(--deep);background:#fff}
.netbadge.ok{color:#1c7d36}.netbadge.warn{color:#a67c00}
.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.ddbtn{min-width:170px}}
.left{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
@media(max-width:900px){.left{position:static}}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-bottom:2px dashed var(--line)}
.stat:last-of-type{border:0}
.stat .lbl{font-size:9px;color:var(--deep)}
.stat b{font-family:'Press Start 2P',monospace;font-size:13px}
#st-coins{font-size:18px;color:#a8602c}
.coinwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
#coin{width:230px;height:230px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:manipulation;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);-webkit-tap-highlight-color:transparent}
#coin img{width:100%;height:100%;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 8px 0 rgba(0,0,0,.18))}
#coin img.sub{width:78%;height:78%}
#coin.pop{animation:pop .12s}
@keyframes pop{50%{transform:scale(.9)}}
.floaty{position:fixed;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;text-shadow:2px 2px 0 var(--deep),-1px -1px 0 var(--deep);z-index:500;animation:flt .9s ease-out forwards}
@keyframes flt{to{transform:translateY(-70px);opacity:0}}
.page{min-width:0}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
/* shop */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pack{position:relative;aspect-ratio:1;border-radius:24px;border:4px solid rgba(0,0,0,.35);background-size:cover;image-rendering:pixelated;box-shadow:0 7px 0 rgba(0,0,0,.28),inset 0 0 0 3px rgba(255,255,255,.35);cursor:pointer;overflow:hidden;transition:transform .12s}
.pack:hover{transform:translateY(-4px) rotate(-.6deg)}
.pack:active{transform:translateY(1px)}
.pack.static{cursor:default;width:min(220px,60vw);margin:0 auto}.pack.static:hover{transform:none}
.pname{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);text-align:center;font-size:11px;line-height:1.5;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.55),-1px -1px 0 rgba(0,0,0,.4);word-break:break-word}
.ps{position:absolute;width:25%;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.ps0{left:6%;top:14%}.ps1{right:6%;top:30%}.ps2{left:6%;bottom:9%}.ps3{right:6%;bottom:9%}
.pcost{position:absolute;right:8px;top:8px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);color:#fff;font-family:'Press Start 2P',monospace;font-size:10px;padding:6px 8px;border-radius:10px;border:2px solid rgba(255,255,255,.7)}
.pcost img{width:14px;height:14px}
.plimit{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:'Press Start 2P',monospace;font-size:7px;color:#fff;text-shadow:1px 1px 0 #000}
/* modals */
.mback{position:fixed;inset:0;background:rgba(10,30,60,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:300;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--card);border:4px solid var(--deep);border-radius:20px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.modal .x{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:10px;border:3px solid var(--deep);background:#fff;color:var(--deep);font-weight:900;cursor:pointer;z-index:2}
.mbtns{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.chances{margin-top:14px;max-height:230px;overflow:auto;border:3px solid var(--line);border-radius:12px;background:#fff;padding:6px}
.crow{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px;border-bottom:1px solid #e3f1fc}
.crow i{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.3)}
.crow .cn{flex:1;font-weight:700}.crow .cr{opacity:.65;font-size:11px}.crow .cp{font-family:'Press Start 2P',monospace;font-size:9px;min-width:70px;text-align:right}
/* reveal */
#reveal{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.84);padding:20px;text-align:center}
#reveal.on{display:flex;animation:fade .15s}
#reveal.rainbow{background:linear-gradient(120deg,#ff3b3b,#ff9d00,#fff200,#38e24a,#18d4ff,#3a5bff,#b13bff,#ff3b3b);background-size:500% 500%;animation:rb 4s linear infinite}
@keyframes rb{0%{background-position:0 50%}100%{background-position:100% 50%}}
.rvspot{position:relative;width:min(260px,60vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.55) 45%,rgba(255,255,255,0) 70%);animation:popin .35s cubic-bezier(.2,1.6,.4,1)}
.rvspot img{width:74%;image-rendering:pixelated;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
@keyframes popin{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.rvtag{margin-top:18px;font-family:'Press Start 2P',monospace;font-size:11px;padding:8px 12px;border-radius:10px;border:3px solid #fff;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
.rvname{margin-top:12px;font-family:'Press Start 2P',monospace;font-size:20px;color:#fff;line-height:1.4;text-shadow:3px 3px 0 rgba(0,0,0,.6),0 0 14px var(--rc,#fff)}
.rvchance{margin-top:10px;font-size:16px;font-weight:800;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
.rvmsg{max-width:560px;font-size:20px;font-weight:800;color:#fff;margin:18px 0;line-height:1.5;text-shadow:2px 2px 0 rgba(0,0,0,.6);word-break:break-word}
#confetti{position:fixed;inset:0;z-index:950;pointer-events:none}
.v-gold{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.15) drop-shadow(0 0 5px #ffd400)}
.v-diamond{filter:grayscale(1) sepia(1) hue-rotate(150deg) saturate(6) brightness(1.3) drop-shadow(0 0 6px #6ff)}
.v-rainbow{animation:hue 2s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg) saturate(2) drop-shadow(0 0 6px #fff)}}
.v-cursed{filter:sepia(1) hue-rotate(-40deg) saturate(6) brightness(.55) drop-shadow(0 0 7px #f00)}
.v-emerald{filter:sepia(1) hue-rotate(70deg) saturate(6) brightness(1.1) drop-shadow(0 0 7px #0f6)}
.v-amethyst{filter:sepia(1) hue-rotate(230deg) saturate(6) brightness(1.05) drop-shadow(0 0 7px #b0f)}
/* index */
.idxhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.idxpack{margin-bottom:20px}
.idxpack h3{display:flex;align-items:center;gap:8px;color:#fff;padding:10px 12px;border-radius:12px;border:3px solid rgba(0,0,0,.3);text-shadow:2px 2px 0 rgba(0,0,0,.4)}
.idxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.tile{position:relative;background:#fff;border:3px solid var(--rc);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.tile:hover{transform:translateY(-3px)}
.tile img{width:60px;height:60px;image-rendering:pixelated}
.tile.locked img{filter:brightness(0) opacity(.28)}
.tile.locked{cursor:default;border-color:#cfe3f3;box-shadow:none}.tile.locked:hover{transform:none}
.tile .tn{font-size:11px;font-weight:700;line-height:1.2;margin-top:4px;word-break:break-word}
.tile .cnt{position:absolute;right:4px;top:4px;background:var(--rc);color:#fff;font-family:'Press Start 2P',monospace;font-size:8px;padding:4px 5px;border-radius:8px;text-shadow:1px 1px 0 #000}
.idetail{text-align:center}
.idetail .big{width:150px;height:150px;image-rendering:pixelated;margin:6px auto;display:block}
.idetail .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 9px;border:2px solid var(--deep);border-radius:99px;font-size:12px;font-weight:700;background:#fff;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.rtag{display:inline-block;font-family:'Press Start 2P',monospace;font-size:9px;padding:5px 8px;border-radius:8px;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.5)}
/* chat */
.chatbox{display:flex;flex-direction:column;height:min(72vh,640px)}
#chatlog{flex:1;overflow:auto;background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;background:#eaf6ff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;align-self:flex-start;word-break:break-word}
.msg.mine{align-self:flex-end;background:#d4ecff}
.msg .mh{font-size:12px;font-weight:800;margin-bottom:3px}.msg .mt{font-weight:400;opacity:.55;margin-left:6px;font-size:10px}
.chimg{max-width:100%;max-height:260px;border-radius:8px;display:block;margin-top:6px}
.chfile{display:inline-block;margin-top:6px;padding:6px 10px;background:#fff;border:2px solid var(--deep);border-radius:8px;color:var(--deep);font-weight:700;text-decoration:none;font-size:13px}
.chatin{display:flex;gap:8px;margin-top:10px;align-items:center}
.chatin input[type=text]{flex:1}
.attach{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px;font-weight:700}
/* board */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:3px solid var(--line)}
th{font-family:'Press Start 2P',monospace;font-size:8px;text-align:left;padding:10px;background:#dff1ff;color:var(--deep)}
td{padding:9px 10px;border-top:1px solid #e3f1fc;font-size:14px}
tr.me td{background:#fff8d6}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#bbb;margin-right:6px}.dot.on{background:#35c75a}
.rk{font-family:'Press Start 2P',monospace;font-size:11px}
.crown{margin-right:4px}
/* battles */
.bmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:16px}
.bmode{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.bmode p{margin:0;font-size:13px}
.petgrid{display:flex;flex-wrap:wrap;gap:8px}
.petpick{width:84px;text-align:center;background:#fff;border:3px solid var(--rc);border-radius:12px;padding:6px 3px;cursor:pointer;font-size:10px;font-weight:700;position:relative}
.petpick img{width:44px;height:44px;image-rendering:pixelated}
.petpick.sel{background:#d4ecff;box-shadow:0 0 0 3px var(--blue)}
#battle{position:fixed;inset:0;z-index:700;display:none;background:linear-gradient(#8fd2ff 0,#cdeeff 45%,#7fcf6a 45%,#5bb64f 100%);flex-direction:column}
#battle.on{display:flex}
.btbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(244,251,255,.9);border-bottom:3px solid var(--deep);gap:10px;flex-wrap:wrap;font-weight:800}
.arena{flex:1;position:relative;min-height:300px}
.bpl{position:absolute;display:flex;align-items:flex-end;gap:14px}
.bpl.foe{right:6%;top:6%;flex-direction:row-reverse;align-items:flex-start}
.bpl.me{left:6%;bottom:4%}
.spr{width:min(170px,28vw);height:min(170px,28vw);image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(0,0,0,.2))}
.bpl.me .spr{transform:scaleX(-1)}
.spr.shake{animation:shk .35s}@keyframes shk{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}}
.bpl.me .spr.shake{animation:shk2 .35s}@keyframes shk2{20%{transform:scaleX(-1) translateX(-10px)}40%{transform:scaleX(-1) translateX(10px)}60%{transform:scaleX(-1) translateX(-6px)}}
.spr.lunge{animation:lg .3s}@keyframes lg{50%{margin-left:-40px}}
.bpl.me .spr.lunge{animation:lg2 .3s}@keyframes lg2{50%{margin-left:40px}}
.spr.glow{animation:gl .6s}@keyframes gl{50%{filter:brightness(1.6) drop-shadow(0 0 16px #5f5)}}
.spr.dead{opacity:.2;transition:opacity .5s}
.bbox{background:rgba(255,255,255,.95);border:3px solid var(--deep);border-radius:12px;padding:8px 10px;min-width:210px}
.bbox .bn{font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;margin-bottom:6px}
.hp{height:14px;background:#ddd;border:2px solid var(--deep);border-radius:8px;overflow:hidden}
.hp i{display:block;height:100%;background:#35c75a;transition:width .5s,background .5s}
.bbox .ht{font-size:11px;font-weight:800;margin-top:3px}
.bbox .dots{margin-top:3px;font-size:10px;letter-spacing:2px}
.btlog{min-height:56px;background:rgba(15,42,74,.9);color:#fff;font-weight:700;padding:12px 16px;font-size:15px}
.moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 16px 16px;background:rgba(244,251,255,.95)}
.bcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:rgba(15,42,74,.78);color:#fff;z-index:5}
.bcenter .big{font-family:'Press Start 2P',monospace;font-size:18px;line-height:1.6}
.spinner{width:46px;height:46px;border:6px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* owner */
.ostats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ostats .panel{text-align:center;padding:12px}.ostats b{display:block;font-family:'Press Start 2P',monospace;font-size:15px;margin-top:6px;color:var(--deep)}
.ostats span{font-size:12px;font-weight:700}
.osec{margin-bottom:14px}
.orow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.orow input[type=number]{width:140px}
.opacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opk{display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:10px;padding:6px 8px}
.opk i{width:18px;height:18px;border-radius:5px;border:2px solid rgba(0,0,0,.4);flex:none}.opk span{flex:1;font-size:12px;font-weight:700}
.tblwrap{overflow:auto;max-height:420px;border-radius:12px}
.editrow{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:13px}.editrow span{flex:1}.editrow input{width:130px;padding:5px 8px}
#banner{position:fixed;top:0;left:0;right:0;z-index:800;background:linear-gradient(90deg,#ffc800,#ff9d00);color:#3a2000;font-weight:800;text-align:center;padding:12px 44px;border-bottom:4px solid #a65f00;display:none}
#banner.on{display:block;animation:slide .3s}@keyframes slide{from{transform:translateY(-100%)}}
#banner button{position:absolute;right:10px;top:7px;border:0;background:rgba(0,0,0,.15);width:30px;height:30px;border-radius:8px;font-weight:900;cursor:pointer}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:1000;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:fade .15s}
.toast.good{background:#1c7d36}.toast.bad{background:#a62b30}
</style>
</head>
<body>
<div id="banner"><span id="bannerTxt"></span><button id="bannerX">✕</button></div>

<!-- AUTH -->
<div id="auth">
  <div class="panel authbox">
    <h1>SUPER<br>CLICKER</h1>
    <div class="tag">Click. Open packs. Battle. Rule the board.</div>
    <div id="a-home" class="stack">
      <button class="btn" id="goLogin">LOG IN</button>
      <button class="btn alt" id="goSignup">MAKE ACCOUNT</button>
    </div>
    <form id="a-login" hidden autocomplete="on">
      <label>Username</label><input id="l-user" autocomplete="username" maxlength="16">
      <label>Password</label><input id="l-pass" type="password" autocomplete="current-password">
      <div class="err" id="l-err"></div>
      <button class="btn" type="submit">LOG IN</button>

  const m = modal(`<h3>EDIT ${esc(p.name.toUpperCase())}</h3><div class="orow"><input id="ep_name" value="${esc(p.name)}" style="flex:1"><input id="ep_cost" type="number" min="0" value="${p.cost}" style="width:100px"><input id="ep_color" type="color" value="${p.color}" style="width:56px;padding:2px"></div><div class="chances" style="max-height:300px">${items.map((it, i) => `<div class="editrow"><i style="width:11px;height:11px;border-radius:3px;background:${RAR[it.rarity].color}"></i><span>${esc(it.name)}</span><input type="number" step="any" min="0" data-i="${i}" value="${it.w}"></div>`).join('')}</div><div class="small" style="margin-top:6px">Weights are relative; the shop shows them as percentages of the pack total. Changes are sent to every online player.</div><div class="mbtns"><button class="btn green" id="ep_save">SAVE</button><button class="btn alt" id="ep_reset">RESET PACK</button></div>`);
  $('#ep_save', m).onclick = () => { const w = {}; $$('[data-i]', m).forEach(inp => { w[items[+inp.dataset.i].name] = Math.max(0, +inp.value || 0) }); PACKEDITS[id] = { name: $('#ep_name', m).value.trim() || p.name, cost: Math.max(0, +$('#ep_cost', m).value || 0), color: $('#ep_color', m).value, w }; pushPacks(); closeModal(); toast('Pack saved', 'good') };
  $('#ep_reset', m).onclick = () => { delete PACKEDITS[id]; pushPacks(); closeModal(); toast('Pack reset', 'good') };
}
function pushPacks() { lsSet('sc_packedits', PACKEDITS); applyOverrides(PACKEDITS); adminSend('*', 'packs', { ov: PACKEDITS }, true); renderOwner() }
setInterval(() => { if (isOwner() && PACKS.length) { /* re-announce pack edits to latecomers every 2 min */ if (Object.keys(PACKEDITS).length && Date.now() % 120000 < 5000) adminSend('*', 'packs', { ov: PACKEDITS }, true) } }, 5000);

/* ===== boot ===== */
authView('home');
{ const A = ACCTS(), k = CONFIG.OWNER_ACCOUNT.username.toLowerCase(); A[k] = Object.assign({}, CONFIG.OWNER_ACCOUNT, { created: (A[k] && A[k].created) || Date.now() }); lsSet('sc_accounts', A) }
(async () => { const s = lsGet('sc_session', null), a = s && ACCTS()[s]; if (a && !(BANS.includes(s) && s !== CONFIG.OWNER.toLowerCase())) enter(a) })();
</script>
